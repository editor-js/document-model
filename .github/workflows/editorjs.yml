name: EditorJS check
on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  package-check:
    uses: ./.github/workflows/package-check.yml
    with:
      package-name: '@editorjs/editorjs'
      working-directory: './packages/editorjs'
      include-mutations: false
      # The ARIA semantics this package's UI depends on are only enforced by the Playwright
      # suite — nothing in the type surface catches a dropped role or accessible name.
      # `voiceover.spec.ts` stays out of it: screen readers can't run headless or in parallel.
      include-e2e: true
    secrets:
      stryker_dashboard_api_key: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

  # Deliberately a job condition rather than a `paths:` filter on the workflow. A workflow
  # skipped by path filtering leaves its checks Pending forever, which blocks a PR that is
  # required to pass it; a skipped *job* reports success and does not. So this workflow always
  # runs and the expensive job below decides for itself whether it has anything to do.
  voiceover-should-run:
    name: Check if VoiceOver suite needs to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine if the VoiceOver suite should run
        id: check
        run: |
          # The merge queue is the last gate before main, so it always runs the suite
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if bash .github/scripts/should-run-voiceover.sh "${{ github.base_ref }}" --verbose; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

  voiceover:
    name: VoiceOver
    needs: voiceover-should-run
    if: ${{ needs.voiceover-should-run.outputs.run == 'true' }}
    # A real screen reader needs a real macOS window server session. Standard runner, which is
    # what keeps this free on a public repository - the larger variants are billed regardless.
    runs-on: macos-15
    # Seventeen tests at the config's five-minute per-test budget, run one at a time. The cap is
    # well above the expected runtime and exists so a wedged VoiceOver fails rather than hangs.
    timeout-minutes: 60
    # Only five macOS jobs can run at once across the whole account, so a superseded push must
    # not keep one of them occupied for the rest of its run
    concurrency:
      group: voiceover-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Run VoiceOver tests
        uses: ./.github/actions/voiceover-tests
        with:
          package-name: '@editorjs/editorjs'
          working-directory: './packages/editorjs'
