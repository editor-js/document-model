name: Base coverage
description: "Checkout base ref, run package coverage and upload artifact"
inputs:
  package-name:
    description: 'Full package name (workspace)'
    required: true
  working-directory:
    description: 'Working directory relative to repo root (package folder)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout base ref
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.pull_request.base.ref }}
        fetch-depth: 0

    # A base-ref comparison only means something when the base ref can actually produce
    # a coverage report. Two cases cannot: the package may not exist there yet, or it may
    # exist without a test suite, which is the case for the PR that first adds one. The
    # second needs its own check -- package.json is present, so the file test passes, and
    # `yarn workspace ... test:coverage` then fails with "couldn't find a script".
    - name: Check base ref can report coverage
      id: check
      shell: bash
      run: |
        if [ ! -f "${{ inputs.working-directory }}/package.json" ]; then
          echo "Package not present on base ref (new package), skipping base coverage"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        elif ! node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync(process.argv[1] + '/package.json', 'utf8'));
          process.exit(pkg.scripts && pkg.scripts['test:coverage'] ? 0 : 1);
        " "${{ inputs.working-directory }}"; then
          echo "Package has no test:coverage script on base ref (suite added in this PR), skipping base coverage"
          echo "exists=false" >> "$GITHUB_OUTPUT"
        else
          echo "exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Node
      if: steps.check.outputs.exists == 'true'
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Setup environment
      if: steps.check.outputs.exists == 'true'
      uses: ./.github/actions/setup

    - name: Build the package
      if: steps.check.outputs.exists == 'true'
      shell: bash
      run: yarn workspace ${{ inputs.package-name }} run build
      working-directory: ${{ inputs.working-directory }}

    - name: Run coverage
      if: steps.check.outputs.exists == 'true'
      shell: bash
      run: yarn workspace ${{ inputs.package-name }} test:coverage
      working-directory: ${{ inputs.working-directory }}

    - name: Upload base coverage artifact
      if: steps.check.outputs.exists == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: test-report-base
        path: |
          ${{ inputs.working-directory }}/coverage
          ${{ inputs.working-directory }}/jest-report.json
        retention-days: 3
